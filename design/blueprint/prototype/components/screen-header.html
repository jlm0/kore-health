<header class="screen-header" data-blueprint-component="screen-header" data-blueprint-state="date">
  <span class="screen-header__side">
    <blueprint-use kind="primitive" ref="back-button" state="md"></blueprint-use>
  </span>
  <b class="screen-header__title" data-blueprint-slot="title">Sleep</b>
  <span class="screen-header__side screen-header__side--right">
    <blueprint-use kind="primitive" ref="label" state="default" variant="date" class="screen-header__date"><span slot="text"><i data-blueprint-slot="meta">Sep 26</i></span></blueprint-use>
    <blueprint-use kind="primitive" ref="badge" state="default" variant="mint" size="count" class="screen-header__count"><b slot="label"><i data-blueprint-slot="count">7 d</i></b></blueprint-use>
  </span>
</header>
