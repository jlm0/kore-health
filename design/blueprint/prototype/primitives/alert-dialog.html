<div data-blueprint-primitive="alert-dialog" data-blueprint-state="neutral" data-blueprint-variant="default" role="alertdialog" aria-modal="true" aria-labelledby="alert-dialog-title" aria-describedby="alert-dialog-message">
  <h2 class="alert-dialog__title" id="alert-dialog-title" data-blueprint-slot="title">Discard changes?</h2>
  <p class="alert-dialog__message" id="alert-dialog-message" data-blueprint-slot="message">This action cannot be undone.</p>
  <div class="alert-dialog__actions">
    <button class="alert-dialog__action" type="button">Cancel</button>
    <button class="alert-dialog__action alert-dialog__action--confirm" type="button">Confirm</button>
  </div>
</div>
