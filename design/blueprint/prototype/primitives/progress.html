<div data-blueprint-primitive="progress" data-blueprint-state="value" data-blueprint-variant="default">
  <span class="progress__head">
    <span class="progress__label" data-blueprint-slot="label">Uploading files</span>
    <span class="progress__value progress__value--value">60%</span>
    <span class="progress__value progress__value--complete">Done</span>
  </span>
  <span class="progress__track" role="progressbar" aria-label="Uploading files" aria-valuemin="0" aria-valuemax="100" aria-valuenow="60"><span class="progress__bar"></span></span>
</div>
