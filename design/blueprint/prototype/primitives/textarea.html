<label data-blueprint-primitive="textarea" data-blueprint-state="empty" data-blueprint-variant="default">
  <span class="textarea__label" data-blueprint-slot="label">Notes</span>
  <span class="textarea__control">
    <textarea class="textarea__field" rows="3" aria-label="Notes"></textarea>
    <span class="textarea__placeholder" data-blueprint-slot="placeholder" aria-hidden="true">Add a note for the team</span>
    <span class="textarea__value" aria-hidden="true">Ship the onboarding checklist before the Friday review.<span class="textarea__caret"></span></span>
  </span>
  <span class="textarea__hint" data-blueprint-slot="hint">Visible to everyone in the workspace.</span>
</label>
