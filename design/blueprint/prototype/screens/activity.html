<main class="k-screen activity" data-blueprint-screen="activity" data-blueprint-state="populated">
  <blueprint-use kind="component" ref="aura-background" state="default"></blueprint-use>
  <div class="k-content">
    <div class="activity-header activity-header--populated"><blueprint-use kind="component" ref="screen-header" state="date" data-blueprint-section="header"><b slot="title">Activity</b><em slot="meta">Sep 26</em></blueprint-use></div>
    <div class="activity-header activity-header--empty"><blueprint-use kind="component" ref="screen-header" state="plain"><b slot="title">Activity</b></blueprint-use></div>

    <section class="glass glass--brand glass--r28 glass--peach k-card activity-hero k-enter k-enter--1" data-blueprint-section="score" data-blueprint-surface>
      <div class="activity-hero__top">
        <blueprint-use kind="primitive" ref="score-ring" state="default" variant="activity" size="md" class="activity-hero__ring"><span slot="center"><b>21</b><small>Score</small></span></blueprint-use>
        <div class="activity-hero__body">
          <blueprint-use kind="primitive" ref="label" state="default"><span slot="text">Active calories</span></blueprint-use>
          <blueprint-use kind="primitive" ref="metric-value" state="default" variant="hero"><b slot="value">101</b><small slot="unit">cal</small></blueprint-use>
          <p class="k-caption">20% of your 500 cal goal</p>
          <blueprint-use kind="primitive" ref="progress" state="value" variant="activity" class="activity-hero__goal"></blueprint-use>
        </div>
      </div>
      <div class="k-stats activity-hero__stats">
        <blueprint-use kind="primitive" ref="stat-block" state="default"><b slot="value">0</b><small slot="label">Steps</small></blueprint-use>
        <blueprint-use kind="primitive" ref="stat-block" state="default"><b slot="value">0 km</b><small slot="label">Distance</small></blueprint-use>
      </div>
    </section>
