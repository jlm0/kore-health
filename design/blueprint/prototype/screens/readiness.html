<main class="k-screen readiness" data-blueprint-screen="readiness" data-blueprint-state="populated">
  <blueprint-use kind="component" ref="aura-background" state="default"></blueprint-use>
  <div class="k-content">
    <div class="readiness-header readiness-header--populated"><blueprint-use kind="component" ref="screen-header" state="date" data-blueprint-section="header"><b slot="title">Readiness</b><em slot="meta">Sep 26</em></blueprint-use></div>
    <div class="readiness-header readiness-header--empty"><blueprint-use kind="component" ref="screen-header" state="plain"><b slot="title">Readiness</b></blueprint-use></div>

    <section class="glass glass--brand glass--r28 glass--mint readiness-hero k-enter k-enter--1" data-blueprint-section="score" data-blueprint-surface>

      <blueprint-use kind="primitive" ref="badge" state="default" variant="mint" size="status" class="readiness-hero__delta"><b slot="label">+2 vs 7-day avg</b></blueprint-use>

    <section class="glass glass--r28 readiness-contributors k-enter k-enter--2" data-blueprint-section="contributors" data-blueprint-surface>

        <blueprint-use kind="component" ref="contributor-row" state="good" class="readiness-contributor readiness-contributor--hrvBalance"><em slot="label">HRV balance</em></blueprint-use>
        <blueprint-use kind="component" ref="contributor-row" state="warn" class="readiness-contributor readiness-contributor--bodyTemp"><em slot="label">Body temp</em></blueprint-use>
        <blueprint-use kind="component" ref="contributor-row" state="good" class="readiness-contributor readiness-contributor--sleep"><em slot="label">Sleep</em></blueprint-use>
        <blueprint-use kind="component" ref="contributor-row" state="good" class="readiness-contributor readiness-contributor--restingHr"><em slot="label">Resting HR</em></blueprint-use>
        <blueprint-use kind="component" ref="contributor-row" state="good" class="readiness-contributor readiness-contributor--recovery"><em slot="label">Recovery</em></blueprint-use>
        <blueprint-use kind="component" ref="contributor-row" state="warn" class="readiness-contributor readiness-contributor--activityBalance"><em slot="label">Activity balance</em></blueprint-use>
