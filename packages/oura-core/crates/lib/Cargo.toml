[package]
name = "oura_core"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow = "1.0.99"
craby = "0.1.0-rc"
cxx = { version = "1.0.187", features = ["c++20"] }
hex = "0.4"
serde = "1"
serde_json = "1"
oura-protocol = { path = "../../../../third_party/open_oura/crates/oura-protocol" }

[build-dependencies]
craby_build = { version = "0.1.0-rc", features = ["cxx"] }

[lib]
name = "ouracore"
crate-type = ["staticlib"]
